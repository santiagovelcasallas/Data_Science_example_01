[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alumina_pipeline"
version = "0.1.0"
description = "Generative AI pipeline for Al2O3-dissolving ionic liquids / deep eutectic solvents"
requires-python = ">=3.10"

[project.scripts]
alumina-pipeline = "alumina_pipeline.orchestrator:main"

[tool.setuptools.packages.find]
where = ["src"]
